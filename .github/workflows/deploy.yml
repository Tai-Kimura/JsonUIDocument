name: Deploy docs to S3 + CloudFront

# Pipeline: jsonui-cli toolchain (sync_tool + jui build) → Next.js static export
# → S3 (private) → CloudFront (jsonui.tanosys.com).
# Auth is via GitHub OIDC assuming an AWS IAM role — no long-lived AWS keys.
# Infra is defined in infra/terraform/.
#
# Why the toolchain steps: src/generated/* (incl. ColorManager, StringManager,
# component TSX) and rjui_tools/ are NOT committed — they are produced by
# `jui build` from docs/screens/. A bare `npm run build` fails with
# "Module not found: @/generated/ColorManager". See infra/DESIGN.md §6.

on:
  push:
    branches: [main]
    paths:
      - "jsonui-doc-web/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE_ARN: arn:aws:iam::544218887430:role/jsonui-doc-gha-deploy
  SITE_BUCKET: jsonui-tanosys-com-site
  DISTRIBUTION_ID: ESH27Z3X4XNHO
  # jsonui-cli is pinned to a known-good commit SHA for reproducible deploys.
  # Bump procedure: pick the new jsonui-cli main SHA, replace this value, and
  # review the regenerated reference pages in that deploy — the SHA bump is
  # the review point for reference updates.
  JSONUI_CLI_REF: ed19638d39d606ea37d1d6224896374a4fd23bfa # v1.7.53

jobs:
  # REPORTING ONLY — `deploy` does not depend on this job, and a failure here
  # does not stop a deploy.
  #
  # Six gates run before every push to this repository and none of them has
  # ever run in CI: lint-strings, verify --fail-on-diff, validate:strings,
  # tsc --noEmit, jsonui-doc validate spec, jsonui-test validate. They are a
  # procedure, not a mechanism — skip the local run and nothing catches it.
  # All six report zero findings locally, but CI is a fresh checkout with a
  # --clean build and the toolchain fetched at the pin, so a local zero is
  # not a CI zero. This job measures that before any of them is enforced.
  #
  # Every gate prints its own exit code. A gate that could not run must not
  # read as a gate that passed, so the verdict is `exit=N` per gate and a
  # count at the end, never silence.
  gates-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jsonui-doc-web/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch jsonui-cli toolchain
        run: |
          git init "$RUNNER_TEMP/jsonui-cli"
          git -C "$RUNNER_TEMP/jsonui-cli" remote add origin \
            https://github.com/Tai-Kimura/jsonui-cli.git
          git -C "$RUNNER_TEMP/jsonui-cli" fetch --depth 1 origin "${JSONUI_CLI_REF}"
          git -C "$RUNNER_TEMP/jsonui-cli" checkout --detach FETCH_HEAD
          echo "JSONUI_CLI_PATH=$RUNNER_TEMP/jsonui-cli" >> "$GITHUB_ENV"

      - name: Prepare toolchain and generated sources
        run: |
          python3 "$JSONUI_CLI_PATH/jui_tools/bin/jui" sync_tool
          python3 "$JSONUI_CLI_PATH/jui_tools/bin/jui" build --web-only --clean
          # If this install fails, the two Python gates below report a
          # non-zero exit for that reason rather than for findings. The
          # distinction is the point of running this job at all.
          python3 -m pip install -q -e "$JSONUI_CLI_PATH/test_tools" -e "$JSONUI_CLI_PATH/document_tools" || echo "NOTE: pip install failed"

      - name: Install JS dependencies
        working-directory: jsonui-doc-web
        run: npm ci

      # `tsc --noEmit` resolves `@/data/*.json`, which `prebuild` writes into
      # the gitignored `src/data/`. Locally those files survive from an
      # earlier build, so tsc passes; the first CI run of this job reported
      # `error TS2307: Cannot find module '@/data/cli-commands.json'` for
      # exactly that reason. That is the difference the job was added to find,
      # and it is an ordering fact about the checkout, not a finding about the
      # code — so the fix is to generate the inputs, not to drop the gate.
      - name: Generate prebuild artifacts (inputs to tsc)
        working-directory: jsonui-doc-web
        run: npm run prebuild

      - name: Run the six local-only gates (reporting only)
        run: |
          set +e
          fail=0
          run_gate() {
            name="$1"; shift
            echo "::group::$name"
            "$@"; rc=$?
            echo "GATE $name: exit=$rc"
            [ "$rc" -ne 0 ] && fail=$((fail + 1))
            echo "::endgroup::"
          }
          JUI="python3 $JSONUI_CLI_PATH/jui_tools/bin/jui"
          run_gate lint-strings           $JUI lint-strings
          run_gate verify-fail-on-diff    $JUI verify --fail-on-diff
          run_gate validate-strings       npm --prefix jsonui-doc-web run validate:strings
          run_gate tsc-noEmit             npx --prefix jsonui-doc-web tsc --noEmit \
                                            --project jsonui-doc-web/tsconfig.json
          run_gate jsonui-doc-validate    python3 "$JSONUI_CLI_PATH/document_tools/jsonui-doc" \
                                            validate spec docs/screens/json
          # Directory argument, not a `find` expansion: a partial argument list
          # is the shape that used to uninstall the tests it did not name, and
          # --no-install removes the install step from this reporting run
          # entirely.
          run_gate jsonui-test-validate   python3 "$JSONUI_CLI_PATH/test_tools/jsonui-test" \
                                            validate --no-install tests/screens
          echo "----"
          echo "gates with a non-zero exit: $fail of 6"
          echo "This job is reporting only; the deploy job is unaffected either way."

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jsonui-doc-web/package-lock.json

      # rjui_tools pins Ruby 3.2.2 (jsonui-doc-web/rjui_tools/.ruby-version).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch jsonui-cli toolchain
        # fetch-by-SHA instead of clone --branch: --branch only accepts
        # branch/tag names, and JSONUI_CLI_REF is pinned to a commit SHA.
        run: |
          git init "$RUNNER_TEMP/jsonui-cli"
          git -C "$RUNNER_TEMP/jsonui-cli" remote add origin \
            https://github.com/Tai-Kimura/jsonui-cli.git
          git -C "$RUNNER_TEMP/jsonui-cli" fetch --depth 1 origin "${JSONUI_CLI_REF}"
          git -C "$RUNNER_TEMP/jsonui-cli" checkout --detach FETCH_HEAD
          echo "JSONUI_CLI_PATH=$RUNNER_TEMP/jsonui-cli" >> "$GITHUB_ENV"

      - name: Sync platform toolchain (populates jsonui-doc-web/rjui_tools)
        run: python3 "$JSONUI_CLI_PATH/jui_tools/bin/jui" sync_tool

      - name: Generate Layout + TSX (src/generated/*)
        run: python3 "$JSONUI_CLI_PATH/jui_tools/bin/jui" build --web-only --clean

      - name: Install JS dependencies
        working-directory: jsonui-doc-web
        run: npm ci

      - name: Build static export
        working-directory: jsonui-doc-web
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync immutable assets (long cache)
        working-directory: jsonui-doc-web
        run: |
          aws s3 sync out/ "s3://${SITE_BUCKET}" \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML (revalidate)
        working-directory: jsonui-doc-web
        run: |
          aws s3 sync out/ "s3://${SITE_BUCKET}" \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
