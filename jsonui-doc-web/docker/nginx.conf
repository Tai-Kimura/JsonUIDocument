server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # next.config.ts has trailingSlash: false → /foo, not /foo/
  # Static export emits foo.html for /foo, so try the .html sibling first.
  location / {
    try_files $uri $uri.html $uri/index.html /404.html;
  }

  # Long cache for hashed asset files; short cache for HTML
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
